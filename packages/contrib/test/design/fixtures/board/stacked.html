<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Feed, one ad — stacked</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        background: #0b0b10;
      }
      body {
        color: #f3f1f6;
        font:
          16px/24px system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        padding: 16px;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 24px;
        width: 100%;
        max-width: 560px;
        margin: 0 auto;
      }
      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.06em;
      }
      .balance {
        background: #20202b;
        border-radius: 999px;
        padding: 8px 16px;
        font-size: 12px;
        font-weight: 600;
        color: #f2a93b;
      }
      .card {
        background: #16161e;
        border: 1px solid #2c2c39;
        border-radius: 16px;
        overflow: hidden;
      }
      .photo {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 200px;
        background: #20202b;
        color: #6b6678;
        font-size: 14px;
      }
      .badges {
        display: flex;
        gap: 8px;
        padding: 16px 16px 0;
      }
      .badge {
        background: #3a121d;
        border-radius: 999px;
        padding: 4px 12px;
        font-size: 12px;
        font-weight: 600;
        color: #ff7387;
      }
      .body {
        padding: 16px;
      }
      .ad-text {
        font-size: 20px;
        font-weight: 600;
        line-height: 26px;
      }
      .meta {
        margin-top: 8px;
        color: #6b6678;
        font-size: 12px;
      }
      .actions {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 16px;
      }
      .primary {
        flex: 1;
        min-height: 44px;
        border: 0;
        border-radius: 8px;
        background: #c62f53;
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
      }
      .icon {
        width: 36px;
        height: 36px;
        border: 1px solid #2c2c39;
        border-radius: 8px;
        background: #20202b;
        color: #f3f1f6;
        font-size: 16px;
      }
      .foot {
        color: #8f8a9c;
        font-size: 12px;
      }
      /* Promoted: the primary colour as text, which the identity forbids. */
      .promoted {
        color: #c62f53;
        font-size: 12px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="stack">
      <header class="bar">
        <span class="brand">FLASH</span>
        <span class="balance">12 diamonds</span>
      </header>
      <article class="card">
        <div class="photo">photo placeholder</div>
        <div class="badges">
          <span class="badge">2h 14m left</span>
          <span class="badge">3 km away</span>
        </div>
        <div class="body">
          <p class="promoted">Promoted</p>
          <p class="ad-text">
            Gallery opening on Saturday. Looking for company and a second
            opinion on the art.
          </p>
          <p class="meta">verified · 178 cm · replies slowly</p>
          <div class="actions">
            <button class="primary" type="button">Instant chat</button>
            <button class="icon" type="button" aria-label="Boost">▲</button>
            <button class="icon" type="button" aria-label="Super like">
              ★
            </button>
          </div>
        </div>
      </article>
      <p class="foot">
        Ads expire on their own, and a conversation deletes itself when it ends.
      </p>
    </div>
  </body>
</html>
