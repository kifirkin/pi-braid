name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v4

      - name: Install Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Check docs
        run: node scripts/check-doc-status.mjs

      - name: Check doc drift
        run: node scripts/check-doc-drift.mjs

      - name: Check deps
        run: node scripts/check-deps.mjs

      - name: Check formatting
        run: npx prettier --check .

      - name: Lint
        run: npx eslint src/ --max-warnings 0

      - name: Build
        run: npm run build

      - name: Test
        run: npm test