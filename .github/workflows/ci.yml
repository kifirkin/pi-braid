name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    # The same chain publish.yml runs, with the same allowance: a budget tighter
    # than the release path's can only ever produce a false red, and a file the
    # runner declares slow (three of them hold allowances of 90s to 150s) is
    # legitimate work, not a hang. The suite's files are walked in a bounded
    # pool (the runner's default width, at most eight), so the wall clock is
    # the slowest lane rather than the sum of the files.
    timeout-minutes: 30

    strategy:
      # The Node line `engines` declares, and the one publish.yml runs, so the
      # gate that reports red and the gate that decides a release see the same
      # runtime. Change it here and in publish.yml together, and only to a
      # version inside `engines`: a release whose gate ran on a version the
      # manifest excludes is the defect this pin exists to prevent.
      matrix:
        node-version: [24]

    steps:
      - uses: actions/checkout@v4

      - name: Install Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The memory session-recall tests assert the rg backend; the runner
      # image does not ship ripgrep.
      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep

      # CI runs the same chain as local. Do not add a check step here: add it
      # to `ci:check` in package.json instead. `check:ci-chain` fails the
      # build when this file re-lists a check.
      - name: Quality gates
        run: npm run ci:check
