name: Publish

# Publishes the workspace packages to npm with trusted publishing (OIDC).
# No npm token is read: the registry exchanges this workflow's GitHub OIDC
# identity for a short-lived publish credential (see CONTRIBUTING.md,
# "Release process").
#
# Release tags name the core manifest version (v<core version>); iteration
# tags (v<version>-main.N) never publish.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      only:
        description: "Publish only this package directory (core|skills|providers|telegram|contrib); empty means every package whose version is not yet on the registry"
        type: string
        default: ""
      dry_run:
        description: "Run npm publish --dry-run for each selected package and stop before any publish"
        type: boolean
        default: false

jobs:
  publish:
    # Iteration tags carry a prerelease segment; they are not releases.
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # write, not read: the last step creates the GitHub release that names the
      # version this run publishes. The publish itself reads no token from here
      # (it exchanges the OIDC identity below), so this block is not a
      # widening of the publishing credential.
      contents: write
      id-token: write

    steps:
      # Full history: the commit-subject gate anchors its range at the newest tag
      # reachable from HEAD, and a shallow clone carries neither.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A tag event is fetched as +<sha>:refs/tags/<name>, which materializes a
      # LIGHTWEIGHT local tag; release:check (inside the gates below) requires
      # the annotated tag object, so a tag run would refuse itself. Re-fetch the
      # tag ref itself and assert the object before the chain runs.
      - name: Materialize the annotated release tag
        if: github.ref_type == 'tag'
        run: |
          git fetch --force --no-recurse-submodules origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = tag
          git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(objecttype) %(objectname) %(taggername)'

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Assert the npm CLI can exchange OIDC credentials
        run: |
          npm --version
          node -e '
            const raw = require("node:child_process").execSync("npm --version").toString().trim();
            const m = /^(\d+)\.(\d+)\.(\d+)$/.exec(raw);
            const v = m ? m.slice(1).map(Number) : [];
            if (!m || v[0] < 11 || (v[0] === 11 && (v[1] < 5 || (v[1] === 5 && v[2] < 1)))) {
              console.error(
                "npm " + raw + " does not satisfy the trusted-publishing floor: a plain x.y.z at 11.5.1 or above is required",
              );
              process.exit(1);
            }
          '

      # The memory session-recall tests assert the rg backend; the runner
      # image does not ship ripgrep (same step as ci.yml).
      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep

      - name: Install
        run: npm ci

      - name: Gates
        run: npm run ci:check

      - name: Publish
        env:
          ONLY: ${{ inputs.only }}
          DRY_RUN: ${{ inputs.dry_run }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          REGISTRY=https://registry.npmjs.org

          echo "npm $(npm --version)  registry ${REGISTRY}"
          echo "workflow ${WORKFLOW_REF}"
          echo "run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          case "${ONLY}" in
            "" | core | skills | providers | telegram | contrib) ;;
            *) echo "refusing: unknown package '${ONLY}'"; exit 1 ;;
          esac

          # A release tag names the core manifest version; an iteration tag
          # never reaches this step (the job condition refuses it).
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            core=$(node -p "require('./packages/core/package.json').version")
            if [ "${GITHUB_REF_NAME}" != "v${core}" ]; then
              echo "refusing: ${GITHUB_REF_NAME} does not name the core version v${core}"
              exit 1
            fi
          fi

          # The registry is the instrument: the read below decides whether a
          # version exists, and a re-run is a no-op for versions already
          # published.
          for dir in core skills providers telegram contrib; do
            if [ -n "${ONLY}" ] && [ "${ONLY}" != "${dir}" ]; then
              continue
            fi

            name=$(node -p "require('./packages/${dir}/package.json').name")
            version=$(node -p "require('./packages/${dir}/package.json').version")

            case "${version}" in
              *-*) echo "skip ${name}@${version}: prerelease version"; continue ;;
            esac
            read_status=0
            read_log="$(npm view "${name}@${version}" version --registry="${REGISTRY}" 2>&1)" || read_status=$?

            if [ "${read_status}" -eq 0 ]; then
              echo "skip ${name}@${version}: already on the registry"
              continue
            fi

            # Only a 404 from the registry means "absent". Any other failure of
            # the read (network, auth, rate limit, proxy) must refuse: reading
            # it as absence would turn a skip into a publish attempt. The test
            # is the conjunction exit 1 AND `E404` in the output, and both edges
            # bind: a read exiting non-1 that carries E404 refuses (stricter
            # than "a 404 means absent"), and a non-404 failure whose text
            # carries E404 reads as absent, where npm's overwrite guard is the
            # backstop.
            read_absent=0
            if [ "${read_status}" -eq 1 ]; then
              case "${read_log}" in *E404*) read_absent=1 ;; esac
            fi
            if [ "${read_absent}" -ne 1 ]; then
              echo "refusing: registry read for ${name}@${version} failed (exit ${read_status}):"
              printf '%s\n' "${read_log}" | sed 's/^/  /'
              exit 1
            fi

            echo "::group::dry run ${name}@${version}"
            (cd "packages/${dir}" && npm publish --dry-run --registry="${REGISTRY}")
            echo "::endgroup::"

            if [ "${DRY_RUN}" = "true" ]; then
              echo "dry-run input set; not publishing ${name}@${version}"
              continue
            fi

            (cd "packages/${dir}" && npm publish --registry="${REGISTRY}")

            # npm skips a `private: true` workspace with exit 0, so the summary
            # is written from a second registry read, not from the publish's
            # exit status.
            if npm view "${name}@${version}" version --registry="${REGISTRY}" >/dev/null 2>&1; then
              {
                echo "### Published ${name}@${version}"
                echo ""
                echo "- registry: ${REGISTRY}"
                echo "- workflow: ${WORKFLOW_REF}"
                echo "- run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
                echo "- ref: ${GITHUB_REF}"
              } >>"${GITHUB_STEP_SUMMARY}"
            else
              {
                echo "### Not confirmed published ${name}@${version}"
                echo ""
                echo "- \`npm publish\` exited 0; a registry read-back immediately after did not return ${name}@${version}"
                echo "- possible causes:"
                echo "  - a \`private: true\` workspace: npm skips it with exit 0, and the log names it"
                echo "  - read-after-write lag: the publish landed and the registry had not yet served it"
                echo "  - a failed read-back (network, auth, rate limit), which says nothing about the registry"
                echo "- run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              } >>"${GITHUB_STEP_SUMMARY}"
            fi
          done

      # Last in the job on purpose: publishing is what the run is for, and this
      # entry is bookkeeping. A failure here (token scope, API rate limit) must
      # not sit in front of the npm publish it would otherwise block.
      #
      # Tag runs only. An iteration tag never reaches this job (the condition
      # above refuses it), and a dispatch may publish versions whose tag the run
      # does not name, so there is nothing to name the entry after.
      - name: GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version=$(node -p "require('./packages/core/package.json').version")

          # A re-run, and a hand-made entry, are both harmless: an entry that
          # already exists is left exactly as it is.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists; leaving it as it is"
            exit 0
          fi

          # The changelog section for this version is the notes source. Exit 2
          # means no section names it, which is not an error: the entry is
          # created from the commit list instead, so a release is never blocked
          # on a missing section. Every other outcome (the argument is not a
          # stable version, the changelog cannot be read) fails the step, since
          # falling back there would hide a real defect in the run.
          notes_file="$(mktemp)"
          notes_status=0
          node packages/core/scripts/release-notes.mjs "${version}" >"${notes_file}" || notes_status=$?
          case "${notes_status}" in
            0) notes=(--notes-file "${notes_file}") ;;
            2) notes=(--generate-notes) ;;
            *) echo "release-notes.mjs exited ${notes_status}"; exit 1 ;;
          esac

          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "pi-braid ${version}" \
            "${notes[@]}"

      # Last in the job, and it cannot fail it: this step describes a publish
      # that already landed, so a red mark here would be a verdict about the
      # run's own artifact rather than a gate in front of it. A difference is a
      # warning, an unreadable archive is a warning, and the step still exits 0
      # — until it has a record of being right on this repository, failing a
      # published release on its word would cost more than the check returns.
      #
      # Tag runs only: a dispatch publishes versions whose tag the run does not
      # name, so there is no tree to compare the registry artifact against.
      - name: Registry artifact check
        if: github.ref_type == 'tag'
        run: |
          # The runner runs this body with `bash -e` (the job log's `shell:`
          # line is that contract), which ends the step at the first non-zero
          # status — before the line that reads it. Every branch below is a
          # report, so the body opts out of that rather than promising
          # something about `-e` a comment cannot enforce. `+u` for the same
          # reason: the reads that may be empty are tested for emptiness, not
          # for definition.
          set +e
          set +u
          #
          # Whether to compare is the registry's answer, not a line written for
          # a human to read: this step consults no rendering surface, so a run
          # that carries none of an earlier attempt's lines still compares the
          # artifact it serves. The only skip is an artifact that cannot be
          # obtained, and each of those prints which fact stopped it and
          # annotates the run as not verified.
          #
          # A status this body inspects is captured where `-e` cannot reach it
          # first — never `cmd` followed by `status=$?` on the next line, which
          # is the shape that ended this step silently once.
          REGISTRY=https://registry.npmjs.org

          # One line on the run page names the verdict. The write is skipped
          # when the runner supplied no summary file, and the text is always a
          # fact this step measured after the measurement that decides it.
          summary() {
            [ -n "${GITHUB_STEP_SUMMARY:-}" ] || return 0
            printf '%s\n' "$1" >>"${GITHUB_STEP_SUMMARY}" 2>/dev/null || true
          }

          # An artifact the step could not obtain is not a verified one. Every
          # such branch emits this annotation, so a green run without an
          # equality line cannot be read as a release whose artifact was
          # compared.
          not_verified() {
            echo "::warning title=Registry artifact not verified::$1"
            summary "- artifact check: not verified: $1"
          }

          version=$(node -p "require('./packages/core/package.json').version" 2>/dev/null) || version=""
          if [ -z "${version}" ]; then
            reason="could not read the core version"
            echo "artifact check: ${reason}; nothing to compare"
            not_verified "${reason}"
            exit 0
          fi

          work=$(mktemp -d)
          trap 'rm -rf "${work}"' EXIT
          mkdir -p "${work}/native"

          # The tag's own tree, packed the way the publish packed it: the same
          # prepack/postpack pair, so the provenance record's commit side is
          # this checkout. Nothing is uploaded — a pack is a read of the tree.
          if ! (cd packages/core && npm pack --pack-destination "${work}/native" >"${work}/native.log" 2>&1); then
            reason="packing packages/core failed"
            echo "artifact check: ${reason}; nothing to compare"
            sed 's/^/  /' "${work}/native.log" 2>/dev/null
            not_verified "${reason}"
            exit 0
          fi
          native_tgz=$(ls "${work}"/native/pi-braid-*.tgz 2>/dev/null | head -1) || native_tgz=""
          if [ -z "${native_tgz}" ]; then
            reason="the local pack produced no tarball"
            echo "artifact check: ${reason}; nothing to compare"
            not_verified "${reason}"
            exit 0
          fi

          # The registry's own pointer to the artifact, for this exact version.
          #
          # The registry accepts a publish before it serves it: on the release
          # this step last observed, npm acknowledged the publish, a read 40s
          # later answered 404, and the version became servable 4m46s after the
          # acknowledgement. The packument is served with
          # `cache-control: public, max-age=300`, so that lag is a cache refresh
          # and not a broken publish. A 404 for this exact version is therefore
          # the lag, not absence, and the read is retried inside a bounded
          # window.
          #
          # A failure that is not a 404 is not retried: it is news about the
          # registry, and waiting five minutes only moves the honest line five
          # minutes later.
          #
          # The window is elapsed by the sleeps between reads, so the bound is
          # window / interval + 1 reads: the default 360s / 15s is 25 reads and
          # 24 x 15s = 360s of waiting, one read's latency per attempt on top.
          # The job's timeout is 30 minutes, so the worst case leaves most of
          # the budget intact while covering a full 300s cache period.
          grace_seconds=${ARTIFACT_CHECK_GRACE_SECONDS:-360}
          grace_interval=${ARTIFACT_CHECK_GRACE_INTERVAL_SECONDS:-15}
          case "${grace_seconds}" in
            *[!0-9]*)
              echo "artifact check: ARTIFACT_CHECK_GRACE_SECONDS='${grace_seconds}' is not a whole number of seconds; using 360"
              grace_seconds=360
              ;;
          esac
          case "${grace_interval}" in
            0 | *[!0-9]*)
              echo "artifact check: ARTIFACT_CHECK_GRACE_INTERVAL_SECONDS='${grace_interval}' is not a positive whole number of seconds; using 15"
              grace_interval=15
              ;;
          esac
          max_reads=$((grace_seconds / grace_interval + 1))

          url=""
          read_number=0
          while :; do
            read_number=$((read_number + 1))
            if url=$(npm view "pi-braid@${version}" dist.tarball --registry="${REGISTRY}" 2>"${work}/view.err"); then
              view_status=0
            else
              view_status=$?
            fi
            if [ "${view_status}" -eq 0 ]; then
              break
            fi

            said=$(grep -m1 . "${work}/view.err" 2>/dev/null)
            [ -n "${said}" ] || said="(the command printed nothing)"
            # The conjunction is the publish step's: a 404 is the only reading
            # of a failed read that means "not served yet", and both edges bind.
            # A read that failed another way is reported at once.
            if ! { [ "${view_status}" -eq 1 ] && grep -qF 'E404' "${work}/view.err" 2>/dev/null; }; then
              reason="the registry read for pi-braid@${version} failed (exit ${view_status}): ${said}"
              echo "artifact check: ${reason}; nothing to compare"
              not_verified "${reason}"
              exit 0
            fi
            if [ "${read_number}" -ge "${max_reads}" ]; then
              reason="pi-braid@${version} was not served by the registry within the ${grace_seconds}s grace window (${read_number} reads, 404): ${said}"
              echo "artifact check: ${reason}; nothing to compare"
              not_verified "${reason}"
              exit 0
            fi
            sleep "${grace_interval}"
          done

          # curl retries the same lag on the download side: the packument can
          # name a tarball the registry is not serving yet. Its 3 retries at 5s
          # each cover the short tail after the pointer appears; the window
          # above covers the wait before the pointer does.
          download_status=0
          curl -fsSL --retry 3 --retry-delay 5 "${url}" -o "${work}/registry.tgz" >"${work}/curl.log" 2>&1 || download_status=$?
          if [ "${download_status}" -ne 0 ]; then
            said=$(grep -m1 . "${work}/curl.log" 2>/dev/null)
            [ -n "${said}" ] || said="(the command printed nothing)"
            reason="the registry served no tarball for pi-braid@${version} (curl exit ${download_status}): ${said}"
            echo "artifact check: ${reason}; nothing to compare"
            not_verified "${reason}"
            exit 0
          fi

          # Content, not bytes: two packs of one tree differ in gzip framing,
          # entry order and the provenance fields that describe the machine the
          # pack ran on, and the tool normalises those before comparing. It also
          # owns the verdict word and the bound on the paths it lists, so the
          # paths are reprinted here rather than restated.
          if node packages/core/scripts/pack-compare.mjs "${native_tgz}" "${work}/registry.tgz" >"${work}/compare.log" 2>&1; then
            compare_status=0
          else
            compare_status=$?
          fi
          case "${compare_status}" in
            0)
              echo "artifact check: the registry artifact for pi-braid@${version} unpacks to the tree ${GITHUB_REF_NAME} builds"
              summary "- artifact check: verified equal: pi-braid@${version} unpacks to the tree ${GITHUB_REF_NAME} builds"
              ;;
            1)
              sed 's/^/  /' "${work}/compare.log"
              echo "::warning title=Registry artifact differs::pi-braid@${version} unpacks differently from a pack of ${GITHUB_REF_NAME}; the paths above are the difference"
              summary "- artifact check: differs: pi-braid@${version} unpacks differently from a pack of ${GITHUB_REF_NAME}"
              ;;
            *)
              sed 's/^/  /' "${work}/compare.log"
              echo "::warning title=Registry artifact unreadable::pack-compare could not read one of the archives (exit ${compare_status}); this is not a verdict about the tree"
              summary "- artifact check: unreadable: pack-compare could not read one of the archives (exit ${compare_status}); not a verdict about the tree"
              ;;
          esac

          exit 0
