name: Publish

# Publishes the workspace packages to npm with trusted publishing (OIDC).
# No npm token is read: the registry exchanges this workflow's GitHub OIDC
# identity for a short-lived publish credential (see CONTRIBUTING.md,
# "Release process").
#
# Release tags name the core manifest version (v<core version>); iteration
# tags (v<version>-main.N) never publish.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      only:
        description: "Publish only this package directory (core|skills|providers|telegram|contrib); empty means every package whose version is not yet on the registry"
        type: string
        default: ""
      dry_run:
        description: "Run npm publish --dry-run for each selected package and stop before any publish"
        type: boolean
        default: false

jobs:
  publish:
    # Iteration tags carry a prerelease segment; they are not releases.
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # A tag event is fetched as +<sha>:refs/tags/<name>, which materializes a
      # LIGHTWEIGHT local tag; release:check (inside the gates below) requires
      # the annotated tag object, so a tag run would refuse itself. Re-fetch the
      # tag ref itself and assert the object before the chain runs.
      - name: Materialize the annotated release tag
        if: github.ref_type == 'tag'
        run: |
          git fetch --force --no-recurse-submodules origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = tag
          git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(objecttype) %(objectname) %(taggername)'

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Assert the npm CLI can exchange OIDC credentials
        run: |
          npm --version
          node -e '
            const raw = require("node:child_process").execSync("npm --version").toString().trim();
            const m = /^(\d+)\.(\d+)\.(\d+)$/.exec(raw);
            const v = m ? m.slice(1).map(Number) : [];
            if (!m || v[0] < 11 || (v[0] === 11 && (v[1] < 5 || (v[1] === 5 && v[2] < 1)))) {
              console.error(
                "npm " + raw + " does not satisfy the trusted-publishing floor: a plain x.y.z at 11.5.1 or above is required",
              );
              process.exit(1);
            }
          '

      # The memory session-recall tests assert the rg backend; the runner
      # image does not ship ripgrep (same step as ci.yml).
      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep

      - name: Install
        run: npm ci

      - name: Gates
        run: npm run ci:check

      - name: Publish
        env:
          ONLY: ${{ inputs.only }}
          DRY_RUN: ${{ inputs.dry_run }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          REGISTRY=https://registry.npmjs.org

          echo "npm $(npm --version)  registry ${REGISTRY}"
          echo "workflow ${WORKFLOW_REF}"
          echo "run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          case "${ONLY}" in
            "" | core | skills | providers | telegram | contrib) ;;
            *) echo "refusing: unknown package '${ONLY}'"; exit 1 ;;
          esac

          # A release tag names the core manifest version; an iteration tag
          # never reaches this step (the job condition refuses it).
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            core=$(node -p "require('./packages/core/package.json').version")
            if [ "${GITHUB_REF_NAME}" != "v${core}" ]; then
              echo "refusing: ${GITHUB_REF_NAME} does not name the core version v${core}"
              exit 1
            fi
          fi

          # The registry is the instrument: the read below decides whether a
          # version exists, and a re-run is a no-op for versions already
          # published.
          for dir in core skills providers telegram contrib; do
            if [ -n "${ONLY}" ] && [ "${ONLY}" != "${dir}" ]; then
              continue
            fi

            name=$(node -p "require('./packages/${dir}/package.json').name")
            version=$(node -p "require('./packages/${dir}/package.json').version")

            case "${version}" in
              *-*) echo "skip ${name}@${version}: prerelease version"; continue ;;
            esac
            read_status=0
            read_log="$(npm view "${name}@${version}" version --registry="${REGISTRY}" 2>&1)" || read_status=$?

            if [ "${read_status}" -eq 0 ]; then
              echo "skip ${name}@${version}: already on the registry"
              continue
            fi

            # Only a 404 from the registry means "absent". Any other failure of
            # the read (network, auth, rate limit, proxy) must refuse: reading
            # it as absence would turn a skip into a publish attempt. The test
            # is the conjunction exit 1 AND `E404` in the output, and both edges
            # bind: a read exiting non-1 that carries E404 refuses (stricter
            # than "a 404 means absent"), and a non-404 failure whose text
            # carries E404 reads as absent, where npm's overwrite guard is the
            # backstop.
            read_absent=0
            if [ "${read_status}" -eq 1 ]; then
              case "${read_log}" in *E404*) read_absent=1 ;; esac
            fi
            if [ "${read_absent}" -ne 1 ]; then
              echo "refusing: registry read for ${name}@${version} failed (exit ${read_status}):"
              printf '%s\n' "${read_log}" | sed 's/^/  /'
              exit 1
            fi

            echo "::group::dry run ${name}@${version}"
            (cd "packages/${dir}" && npm publish --dry-run --registry="${REGISTRY}")
            echo "::endgroup::"

            if [ "${DRY_RUN}" = "true" ]; then
              echo "dry-run input set; not publishing ${name}@${version}"
              continue
            fi

            (cd "packages/${dir}" && npm publish --registry="${REGISTRY}")

            # npm skips a `private: true` workspace with exit 0, so the summary
            # is written from a second registry read, not from the publish's
            # exit status.
            if npm view "${name}@${version}" version --registry="${REGISTRY}" >/dev/null 2>&1; then
              {
                echo "### Published ${name}@${version}"
                echo ""
                echo "- registry: ${REGISTRY}"
                echo "- workflow: ${WORKFLOW_REF}"
                echo "- run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
                echo "- ref: ${GITHUB_REF}"
              } >>"${GITHUB_STEP_SUMMARY}"
            else
              {
                echo "### Not confirmed published ${name}@${version}"
                echo ""
                echo "- \`npm publish\` exited 0; a registry read-back immediately after did not return ${name}@${version}"
                echo "- possible causes:"
                echo "  - a \`private: true\` workspace: npm skips it with exit 0, and the log names it"
                echo "  - read-after-write lag: the publish landed and the registry had not yet served it"
                echo "  - a failed read-back (network, auth, rate limit), which says nothing about the registry"
                echo "- run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              } >>"${GITHUB_STEP_SUMMARY}"
            fi
          done
