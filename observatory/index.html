<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pi-braid Observatory</title>
<style>
  body { margin: 0; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0a1a; color: #e0e0e0; }
  #info {
    position: absolute; top: 20px; left: 20px;
    background: rgba(10,10,30,0.85); padding: 16px 24px;
    border-radius: 12px; border: 1px solid rgba(100,140,255,0.3);
    backdrop-filter: blur(8px); z-index: 10;
    min-width: 260px;
  }
  #info h1 { margin: 0 0 4px 0; font-size: 18px; font-weight: 600; color: #8ab4ff; }
  #info .sub { margin: 0; font-size: 12px; color: #8899bb; }
  #info .stats { margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; font-size: 13px; }
  #info .stats .label { color: #6688aa; }
  #info .stats .value { color: #c0d8ff; text-align: right; font-variant-numeric: tabular-nums; }
  #status-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 8px; vertical-align: middle;
  }
  .connected { background: #4caf50; box-shadow: 0 0 8px #4caf5066; }
  .disconnected { background: #f44336; box-shadow: 0 0 8px #f4433666; }
  #legend {
    position: absolute; bottom: 20px; right: 20px;
    background: rgba(10,10,30,0.85); padding: 12px 16px;
    border-radius: 8px; border: 1px solid rgba(100,140,255,0.2);
    font-size: 12px; z-index: 10;
  }
  #legend .item { display: flex; align-items: center; gap: 8px; margin: 2px 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .dot-turn { background: #4fc3f7; }
  .dot-enforce { background: #ff7043; }
  .dot-timer { background: #ffd54f; }
  .dot-memory { background: #81c784; }
  .dot-context { background: #ce93d8; }
  .dot-heartbeat { background: #4db6ac; }
</style>
</head>
<body>
<div id="info">
  <h1><span id="status-dot" class="disconnected"></span>pi-braid Observatory</h1>
  <p class="sub">Agent Monitoring Dashboard</p>
  <div class="stats">
    <span class="label">Session</span><span class="value" id="session-id">—</span>
    <span class="label">Events</span><span class="value" id="event-count">0</span>
    <span class="label">Turns</span><span class="value" id="turn-count">0</span>
    <span class="label">Tool Calls</span><span class="value" id="tool-count">0</span>
    <span class="label">Uptime</span><span class="value" id="uptime">0s</span>
    <span class="label">Nodes</span><span class="value" id="node-count">0</span>
  </div>
</div>
<div id="legend">
  <div class="item"><span class="dot dot-turn"></span> Turn Complete</div>
  <div class="item"><span class="dot dot-enforce"></span> Enforcement</div>
  <div class="item"><span class="dot dot-timer"></span> Timer Fire</div>
  <div class="item"><span class="dot dot-memory"></span> Memory Evict</div>
  <div class="item"><span class="dot dot-context"></span> Context Full</div>
  <div class="item"><span class="dot dot-heartbeat"></span> Heartbeat Tick</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ── Scene Setup ──────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a1a);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(15, 10, 20);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.style.position = 'absolute';
labelRenderer.domElement.style.top = '0';
labelRenderer.domElement.style.pointerEvents = 'none';
document.body.appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 0, 0);

// ── Lights ─────────────────────────────────────────────────────────
const ambientLight = new THREE.AmbientLight(0x334466, 1.5);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 2);
dirLight.position.set(10, 20, 10);
scene.add(dirLight);

const pointLight = new THREE.PointLight(0x4488ff, 0.5, 50);
pointLight.position.set(-5, 5, -5);
scene.add(pointLight);

// ── Ground Grid ─────────────────────────────────────────────────────
const gridHelper = new THREE.GridHelper(30, 20, 0x334477, 0x223366);
gridHelper.position.y = -2;
scene.add(gridHelper);

// ── Event Colors ────────────────────────────────────────────────────
const COLORS = {
  turn_complete: 0x4fc3f7,
  enforcement_violation: 0xff7043,
  timer_fire: 0xffd54f,
  memory_evict: 0x81c784,
  context_full: 0xce93d8,
  heartbeat_tick: 0x4db6ac,
};

// ── State ───────────────────────────────────────────────────────────
const nodes = [];
const edges = [];
let eventCount = 0;
let turnCount = 0;
let toolCount = 0;
let lastEventTime = Date.now();

// ── Create Event Node ──────────────────────────────────────────────
function createEventNode(type, label, data) {
  const color = COLORS[type] || 0x888888;
  const geometry = new THREE.SphereGeometry(type === 'heartbeat_tick' ? 0.3 : 0.5, 16, 16);
  const material = new THREE.MeshPhongMaterial({
    color,
    emissive: color,
    emissiveIntensity: 0.3,
    transparent: true,
    opacity: 0.9,
  });
  const mesh = new THREE.Mesh(geometry, material);
  
  // Position in a spiral layout
  const angle = eventCount * 0.5;
  const radius = 3 + Math.sin(eventCount * 0.1) * 2;
  const x = Math.cos(angle) * radius;
  const z = Math.sin(angle) * radius;
  const y = Math.sin(eventCount * 0.3) * 1.5;
  mesh.position.set(x, y, z);
  
  // Label
  const div = document.createElement('div');
  div.textContent = label;
  div.style.color = '#c0d8ff';
  div.style.fontSize = '10px';
  div.style.fontFamily = 'monospace';
  div.style.background = 'rgba(10,10,30,0.7)';
  div.style.padding = '2px 6px';
  div.style.borderRadius = '4px';
  div.style.border = '1px solid ' + (type === 'heartbeat_tick' ? '#4db6ac' : '#334477');
  div.style.whiteSpace = 'nowrap';
  
  const labelObj = new CSS2DObject(div);
  labelObj.position.set(x, y + 0.8, z);
  
  scene.add(mesh);
  scene.add(labelObj);
  
  nodes.push({ mesh, label: labelObj, type, data, createdAt: Date.now() });
  eventCount++;
  
  // Pulse animation on creation
  const scale = 2;
  mesh.scale.set(scale, scale, scale);
  animateScale(mesh, scale, 1, 500);
  
  // Connect to last node
  if (nodes.length > 1) {
    const last = nodes[nodes.length - 2];
    const points = [
      new THREE.Vector3(last.mesh.position.x, last.mesh.position.y, last.mesh.position.z),
      new THREE.Vector3(x, y, z),
    ];
    const curve = new THREE.CatmullRomCurve3(points);
    const tubeGeo = new THREE.TubeGeometry(curve, 8, 0.03, 4, false);
    const tubeMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.3 });
    const tube = new THREE.Mesh(tubeGeo, tubeMat);
    scene.add(tube);
    edges.push(tube);
    
    // Fade out old edges
    setTimeout(() => {
      tube.material.opacity = 0.1;
    }, 2000);
  }
  
  updateUI();
}

// ── Scale Animation ────────────────────────────────────────────────
function animateScale(mesh, from, to, duration) {
  const start = Date.now();
  function tick() {
    const t = Math.min(1, (Date.now() - start) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    const scale = from + (to - from) * eased;
    mesh.scale.set(scale, scale, scale);
    if (t < 1) requestAnimationFrame(tick);
  }
  tick();
}

// ── UI Update ──────────────────────────────────────────────────────
function updateUI() {
  document.getElementById('event-count').textContent = eventCount;
  document.getElementById('turn-count').textContent = turnCount;
  document.getElementById('tool-count').textContent = toolCount;
  document.getElementById('node-count').textContent = nodes.length;
  document.getElementById('uptime').textContent = 
    Math.floor((Date.now() - lastEventTime) / 1000) + 's';
}

// ── WebSocket Connection ──────────────────────────────────────────
function connect() {
  const ws = new WebSocket('ws://localhost:4199');
  const dot = document.getElementById('status-dot');
  
  ws.onopen = () => {
    dot.className = 'connected';
    dot.title = 'Connected';
  };
  
  ws.onmessage = (msg) => {
    try {
      const data = JSON.parse(msg.data);
      
      if (data.type === 'metrics_snapshot') {
        // Load initial state
        const m = data.payload;
        document.getElementById('session-id').textContent = m.sessionId || '—';
        if (m.events) {
          for (const ev of m.events.slice(-20)) {
            createEventNode(ev.type, ev.type, ev.data);
          }
        }
        return;
      }
      
      if (data.type === 'metrics_update') {
        const m = data.payload;
        const latest = m.events?.[m.events.length - 1];
        if (latest) {
          createEventNode(latest.type, latest.type, latest.data);
          if (latest.type === 'turn_complete') turnCount = latest.turn;
        }
        return;
      }
      
      // Direct event objects
      if (data.type && data.payload) {
        createEventNode(data.type, data.type, data.payload);
      }
    } catch (e) {
      console.error('Parse error:', e);
    }
  };
  
  ws.onclose = () => {
    dot.className = 'disconnected';
    dot.title = 'Disconnected — retrying in 3s';
    setTimeout(connect, 3000);
  };
  
  ws.onerror = () => {
    ws.close();
  };
}

// ── Animation Loop ─────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  
  // Slowly rotate event nodes
  const time = Date.now() * 0.0003;
  nodes.forEach((node, i) => {
    const baseAngle = i * 0.5;
    const radius = 3 + Math.sin(i * 0.1) * 2;
    const targetX = Math.cos(baseAngle + time * 0.05) * radius;
    const targetZ = Math.sin(baseAngle + time * 0.05) * radius;
    node.mesh.position.x += (targetX - node.mesh.position.x) * 0.02;
    node.mesh.position.z += (targetZ - node.mesh.position.z) * 0.02;
    node.label.position.x = node.mesh.position.x;
    node.label.position.z = node.mesh.position.z;
    
    // Pulse intensity based on age
    const age = Date.now() - node.createdAt;
    const pulse = 0.5 + Math.sin(time * 2 + i) * 0.2;
    node.mesh.material.emissiveIntensity = Math.max(0.1, pulse * (1 - Math.min(1, age / 30000)));
  });
  
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

// ── Start ─────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
});

connect();
animate();

// Demo mode: generate fake events if no server
setTimeout(() => {
  if (eventCount === 0) {
    const types = ['turn_complete', 'enforcement_violation', 'timer_fire', 'memory_evict', 'context_full', 'heartbeat_tick'];
    let i = 0;
    setInterval(() => {
      if (i > 30) return;
      createEventNode(types[i % types.length], types[i % types.length], {});
      i++;
    }, 1500);
  }
}, 5000);
</script>
</body>
</html>
